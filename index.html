<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Import Data Produksi</title>
<style>
  :root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --ink: #1c2530;
    --muted: #64748b;
    --line: #e2e8f0;
    --brand: #1d4ed8;
    --brand-soft: #eff4ff;
    --ok: #15803d;
    --ok-soft: #ecfdf3;
    --bad: #b91c1c;
    --bad-soft: #fef2f2;
    --warn: #a16207;
    --warn-soft: #fefce8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 16px 64px;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 28px; font-size: 14px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 20px;
  }
  .drop {
    border: 2px dashed var(--line);
    border-radius: 10px;
    padding: 36px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .drop:hover, .drop.over { border-color: var(--brand); background: var(--brand-soft); }
  .drop strong { display: block; font-size: 16px; margin-bottom: 4px; }
  .drop span { color: var(--muted); font-size: 13px; }
  input[type=file] { display: none; }
  .picked {
    display: none;
    margin-top: 16px;
    padding: 12px 14px;
    background: var(--brand-soft);
    border-radius: 8px;
    font-size: 14px;
  }
  .picked b { font-weight: 600; }
  button {
    margin-top: 18px;
    width: 100%;
    padding: 13px;
    font: inherit;
    font-weight: 600;
    color: #fff;
    background: var(--brand);
    border: 0;
    border-radius: 8px;
    cursor: pointer;
  }
  button:disabled { background: #94a3b8; cursor: not-allowed; }
  .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 16px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--brand); transition: width .2s; }
  .hidden { display: none; }
  .state { padding: 16px 18px; border-radius: 10px; font-size: 14px; }
  .state.run { background: var(--brand-soft); color: var(--brand); }
  .state.ok { background: var(--ok-soft); color: var(--ok); }
  .state.bad { background: var(--bad-soft); color: var(--bad); }
  .state.warn { background: var(--warn-soft); color: var(--warn); }
  .state b { display: block; font-size: 15px; margin-bottom: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  h2 { font-size: 15px; margin: 0 0 14px; }
  .tag { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; }
  .tag.ok { background: var(--ok-soft); color: var(--ok); }
  .tag.bad { background: var(--bad-soft); color: var(--bad); }
  .tag.run { background: var(--brand-soft); color: var(--brand); }
  .tag.warn { background: var(--warn-soft); color: var(--warn); }
  .empty { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">

  <h1>Import Data Produksi</h1>
  <p class="sub">Unggah file Excel mingguan dari gudang. Prosesnya berjalan otomatis setelah file terkirim.</p>

  <div class="card" id="kartuUpload">
    <div class="drop" id="area">
      <strong>Klik untuk memilih file</strong>
      <span>atau seret file ke sini &middot; format .xlsx</span>
    </div>
    <input type="file" id="berkas" accept=".xlsx,.xlsm">
    <div class="picked" id="terpilih"></div>
    <button id="kirim" disabled>Unggah dan Mulai Import</button>
    <div class="bar hidden" id="bar"><i id="isiBar"></i></div>
  </div>

  <div class="card hidden" id="kartuStatus">
    <div class="state" id="status"></div>
    <table class="hidden" id="tabelRingkasan" style="margin-top:18px">
      <thead><tr><th>Tabel</th><th class="num">Baris</th></tr></thead>
      <tbody id="isiRingkasan"></tbody>
    </table>
  </div>

  <div class="card">
    <h2>Riwayat Import</h2>
    <div id="riwayat" class="empty">Memuat...</div>
  </div>

</div>

<script>
const area = document.getElementById('area');
const berkas = document.getElementById('berkas');
const terpilih = document.getElementById('terpilih');
const kirim = document.getElementById('kirim');
const bar = document.getElementById('bar');
const isiBar = document.getElementById('isiBar');
const kartuStatus = document.getElementById('kartuStatus');
const status = document.getElementById('status');
const tabelRingkasan = document.getElementById('tabelRingkasan');
const isiRingkasan = document.getElementById('isiRingkasan');
const riwayat = document.getElementById('riwayat');

let timer = null;

function ukuran(bytes) {
  if (bytes >= 1073741824) return (bytes / 1073741824).toFixed(2) + ' GB';
  if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + ' MB';
  return (bytes / 1024).toFixed(0) + ' KB';
}

function angka(n) {
  return Number(n || 0).toLocaleString('id-ID');
}

function waktu(nilai) {
  if (!nilai) return '-';
  const d = new Date(nilai);
  if (isNaN(d)) return '-';
  return d.toLocaleString('id-ID', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
}

function label(s) {
  if (s === 'success') return '<span class="tag ok">Berhasil</span>';
  if (s === 'failed') return '<span class="tag bad">Gagal</span>';
  if (s === 'skipped') return '<span class="tag warn">Dilewati</span>';
  return '<span class="tag run">Berjalan</span>';
}

area.addEventListener('click', () => berkas.click());

area.addEventListener('dragover', (e) => {
  e.preventDefault();
  area.classList.add('over');
});

area.addEventListener('dragleave', () => area.classList.remove('over'));

area.addEventListener('drop', (e) => {
  e.preventDefault();
  area.classList.remove('over');
  if (e.dataTransfer.files.length) {
    berkas.files = e.dataTransfer.files;
    tampilkanPilihan();
  }
});

berkas.addEventListener('change', tampilkanPilihan);

function tampilkanPilihan() {
  const f = berkas.files[0];
  if (!f) return;
  terpilih.innerHTML = '<b>' + f.name + '</b> &middot; ' + ukuran(f.size);
  terpilih.style.display = 'block';
  kirim.disabled = false;
}

kirim.addEventListener('click', () => {
  const f = berkas.files[0];
  if (!f) return;

  kirim.disabled = true;
  kirim.textContent = 'Mengunggah...';
  bar.classList.remove('hidden');
  kartuStatus.classList.add('hidden');
  tabelRingkasan.classList.add('hidden');

  const data = new FormData();
  data.append('file', f);

  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/import');

  xhr.upload.addEventListener('progress', (e) => {
    if (e.lengthComputable) {
      const persen = Math.round((e.loaded / e.total) * 100);
      isiBar.style.width = persen + '%';
      kirim.textContent = 'Mengunggah ' + persen + '%';
    }
  });

  xhr.addEventListener('load', () => {
    let hasil = {};
    try { hasil = JSON.parse(xhr.responseText); } catch (err) { hasil = {}; }

    if (xhr.status === 202 && hasil.job_id) {
      kirim.textContent = 'Import sedang berjalan';
      pantau(hasil.job_id);
    } else {
      selesaikanTombol();
      tampilStatus('bad', 'Gagal memulai import', hasil.message || ('Server menjawab kode ' + xhr.status));
    }
  });

  xhr.addEventListener('error', () => {
    selesaikanTombol();
    tampilStatus('bad', 'Koneksi terputus', 'File gagal terkirim ke server. Coba ulangi.');
  });

  xhr.send(data);
});

function selesaikanTombol() {
  kirim.disabled = false;
  kirim.textContent = 'Unggah dan Mulai Import';
  bar.classList.add('hidden');
  isiBar.style.width = '0';
}

function tampilStatus(jenis, judul, isi) {
  kartuStatus.classList.remove('hidden');
  status.className = 'state ' + jenis;
  status.innerHTML = '<b>' + judul + '</b>' + isi;
}

function pantau(jobId) {
  if (timer) clearInterval(timer);
  cek(jobId);
  timer = setInterval(() => cek(jobId), 4000);
}

async function cek(jobId) {
  try {
    const res = await fetch('/status/' + jobId);
    const data = await res.json();
    if (!data.success) return;

    const job = data.job;

    if (job.status === 'running' || job.status === 'queued') {
      const posisi = job.current_table ? 'Sedang memproses tabel <b style="display:inline">' + job.current_table + '</b>' : 'Menyiapkan proses';
      tampilStatus('run', 'Import sedang berjalan', posisi + '<br>' + angka(job.processed_rows) + ' baris sudah masuk. Halaman ini boleh ditinggal, proses tetap jalan.');
      return;
    }

    clearInterval(timer);
    selesaikanTombol();
    muatRiwayat();

    if (job.status === 'success') {
      tampilStatus('ok', 'Import selesai', angka(job.processed_rows) + ' baris berhasil diproses.');
      if (job.summary) {
        isiRingkasan.innerHTML = Object.entries(job.summary)
          .map(([t, n]) => '<tr><td>' + t + '</td><td class="num">' + angka(n) + '</td></tr>')
          .join('');
        tabelRingkasan.classList.remove('hidden');
      }
    } else if (job.status === 'skipped') {
      tampilStatus('warn', 'Import dilewati', 'Ada import lain yang sedang berjalan. Tunggu sampai selesai lalu ulangi.');
    } else {
      tampilStatus('bad', 'Import gagal', (job.error_message || 'Penyebab tidak diketahui') + '<br>Hubungi tim IT dengan menyebut kode job ' + job.job_id + '.');
    }
  } catch (err) {
    clearInterval(timer);
    selesaikanTombol();
    tampilStatus('bad', 'Gagal memeriksa status', 'Koneksi ke server terputus. Muat ulang halaman untuk melihat riwayat.');
  }
}

async function muatRiwayat() {
  try {
    const res = await fetch('/jobs?limit=10');
    const data = await res.json();

    if (!data.success || !data.jobs.length) {
      riwayat.className = 'empty';
      riwayat.textContent = 'Belum ada import yang tercatat.';
      return;
    }

    riwayat.className = '';
    riwayat.innerHTML =
      '<table><thead><tr><th>Waktu</th><th>File</th><th class="num">Baris</th><th>Status</th></tr></thead><tbody>' +
      data.jobs.map((j) =>
        '<tr><td>' + waktu(j.started_at) + '</td><td>' + (j.file_name || '-') + '</td>' +
        '<td class="num">' + angka(j.processed_rows) + '</td><td>' + label(j.status) + '</td></tr>'
      ).join('') +
      '</tbody></table>';
  } catch (err) {
    riwayat.className = 'empty';
    riwayat.textContent = 'Gagal memuat riwayat.';
  }
}

muatRiwayat();
</script>
</body>
</html>
